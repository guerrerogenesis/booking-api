# Render Blueprint: New > Blueprint, pick this repo, then fill in the values marked sync: false.
services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon direct (non-pooled) connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS # Cloudflare + two Render proxies, measured on the deployed service
        value: "3"
      # The public demo sends no emails: anyone could register throwaway addresses and burn
      # the provider quota. To send real emails, use "email" and add SMTP_HOST, SMTP_PORT
      # (2525: the free plan blocks 25, 465 and 587), SMTP_USER, SMTP_PASS and MAIL_FROM.
      - key: NOTIFIER_CHANNEL
        value: log
      # Restores the demo accounts published in the README on every boot.
      - key: SEED_DEMO
        value: "true"
